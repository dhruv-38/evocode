[package]
name = "evocode"
version = "0.1.0"
edition = "2024"
description = "Evocode, an interactive AI terminal agent powered by Groq"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
